<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Domogo Calculator - Consultant Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
  <div id="app"></div>

  <script type="module">
    console.log('=== APP.HTML SCRIPT STARTED ===');

    import { auth } from './src/utils/auth.js';
    import { router } from './src/utils/router.js';
    import { getCustomer } from './src/services/customer-api.js';
    import {
      mockCustomers,
      mockAdvisories,
      mockVersions,
      getCustomerById,
      getAdvisoriesByCustomerId,
      getAdvisoryById,
      getVersionsByAdvisoryId
    } from './src/utils/mock-data.js';
    import './src/main.js';

    console.log('=== ALL IMPORTS SUCCESSFUL ===');

    // App state
    const state = {
      currentUser: null,
      currentCustomer: null,
      currentAdvisory: null,
      customers: mockCustomers,
      advisories: mockAdvisories,
      versions: mockVersions
    };

    // Initialize app
    function init() {
      console.log('Init called, pathname:', window.location.pathname);
      console.log('Is authenticated:', auth.isAuthenticated());

      // Check if user is authenticated
      if (auth.isAuthenticated()) {
        console.log('User is authenticated, showing app');
        state.currentUser = auth.getUser();
        showApp();
      } else {
        console.log('User not authenticated, showing login');
        // Save the intended destination before showing login
        const intendedPath = window.location.pathname;
        console.log('Intended path:', intendedPath);
        if (intendedPath !== '/' && intendedPath !== '/app.html') {
          sessionStorage.setItem('intendedPath', intendedPath);
        }
        showLogin();
      }
    }

    // Show login page
    async function showLogin() {
      document.getElementById('app').innerHTML = `
        <dc-auth-form mode="login"></dc-auth-form>
      `;

      // Wait for component to be defined
      await customElements.whenDefined('dc-auth-form');

      // Handle login
      const authForm = document.querySelector('dc-auth-form');
      authForm.addEventListener('submit', async (e) => {
        const { mode, data } = e.detail;

        try {
          if (mode === 'login') {
            const user = await auth.login(data.email, data.password);
            state.currentUser = user;

            // Check if there's an intended path to redirect to
            const intendedPath = sessionStorage.getItem('intendedPath');
            if (intendedPath) {
              sessionStorage.removeItem('intendedPath');
              // Navigate to intended path after showing app
              showApp();
              router.navigate(intendedPath);
            } else {
              showApp();
            }
          }
        } catch (error) {
          authForm.setAttribute('error', error.message);
        }
      });
    }

    // Show main app
    function showApp() {
      // Set up router routes
      router.add('/app.html', () => router.replace('/customers'));
      router.add('/', () => router.replace('/customers'));
      router.add('/customers', () => renderDashboard());
      router.add('/customers/new', () => renderCustomerForm());
      router.add('/customers/:id/edit', (params) => {
        console.log('Customer edit route matched:', params);
        renderCustomerForm(params.params.id);
      });
      router.add('/customers/:id', (params) => {
        console.log('Customer detail route matched:', params);
        renderCustomerDetail(params.params.id);
      });
      router.add('/customers/:customerId/advisories/:advisoryId', (params) =>
        renderAdvisoryDetail(params.params.customerId, params.params.advisoryId)
      );

      // Add auth check hook
      router.beforeNavigate((path) => {
        if (!auth.isAuthenticated()) {
          showLogin();
          return false;
        }
        return true;
      });

      // Start router
      console.log('Starting router with path:', window.location.pathname);
      router.start();
    }

    // Render dashboard (customers list)
    function renderDashboard() {
      document.getElementById('app').innerHTML = `
        <dc-nav-header
          user-name="${state.currentUser.name}"
          user-role="${state.currentUser.role}"
          active-route="/customers">
        </dc-nav-header>
        <customer-list-page></customer-list-page>
      `;

      // Handle navigation
      document.querySelector('dc-nav-header').addEventListener('navigate', (e) => {
        router.navigate(e.detail.route);
      });

      document.querySelector('dc-nav-header').addEventListener('logout', () => {
        auth.logout();
        showLogin();
      });

      // Handle customer list navigation
      const customerList = document.querySelector('customer-list-page');
      customerList.addEventListener('navigate', (e) => {
        const { route } = e.detail;
        router.navigate(route);
      });
    }

    // Render customer form (create or edit)
    function renderCustomerForm(customerId = null) {
      document.getElementById('app').innerHTML = `
        <dc-nav-header
          user-name="${state.currentUser.name}"
          user-role="${state.currentUser.role}"
          active-route="/customers">
        </dc-nav-header>
        <customer-form-page ${customerId ? `customer-id="${customerId}"` : ''}></customer-form-page>
      `;

      // Handle navigation
      document.querySelector('dc-nav-header').addEventListener('navigate', (e) => {
        router.navigate(e.detail.route);
      });

      document.querySelector('dc-nav-header').addEventListener('logout', () => {
        auth.logout();
        showLogin();
      });

      // Handle customer form navigation
      const customerForm = document.querySelector('customer-form-page');
      customerForm.addEventListener('navigate', (e) => {
        const { route } = e.detail;
        router.navigate(route);
      });
    }

    // Render customer detail page
    function renderCustomerDetail(customerId) {
      document.getElementById('app').innerHTML = `
        <dc-nav-header
          user-name="${state.currentUser.name}"
          user-role="${state.currentUser.role}"
          active-route="/customers">
        </dc-nav-header>
        <customer-page customer-id="${customerId}"></customer-page>
      `;

      // Handle navigation
      document.querySelector('dc-nav-header').addEventListener('navigate', (e) => {
        router.navigate(e.detail.route);
      });

      document.querySelector('dc-nav-header').addEventListener('logout', () => {
        auth.logout();
        showLogin();
      });

      // Handle customer page navigation
      const customerPage = document.querySelector('customer-page');
      customerPage.addEventListener('navigate', (e) => {
        const { route } = e.detail;
        router.navigate(route);
      });
    }

    // Render advisory detail page with versions
    function renderAdvisoryDetail(customerId, advisoryId) {
      const customer = getCustomerById(customerId);
      const advisory = getAdvisoryById(advisoryId);

      if (!customer || !advisory) {
        renderDashboard();
        return;
      }

      const versions = getVersionsByAdvisoryId(advisoryId);

      // Pagination state for versions
      let currentPage = 1;
      const pageSize = 5;
      let sortColumn = 'createdAt';
      let sortDirection = 'desc';

      function getSortedVersions() {
        const sorted = [...versions].sort((a, b) => {
          const aVal = a[sortColumn];
          const bVal = b[sortColumn];
          const modifier = sortDirection === 'asc' ? 1 : -1;
          return aVal < bVal ? -modifier : modifier;
        });
        return sorted;
      }

      function getStatusBadge(status) {
        const badges = {
          draft: '<span style="padding: 0.25rem 0.75rem; background: var(--color-neutral-200); color: var(--color-neutral-700); border-radius: var(--border-radius-full); font-size: var(--font-size-xs); font-weight: var(--font-weight-medium);">Concept</span>',
          sent: '<span style="padding: 0.25rem 0.75rem; background: var(--color-primary-100); color: var(--color-primary-700); border-radius: var(--border-radius-full); font-size: var(--font-size-xs); font-weight: var(--font-weight-medium);">Verzonden</span>',
          approved: '<span style="padding: 0.25rem 0.75rem; background: #dcfce7; color: #15803d; border-radius: var(--border-radius-full); font-size: var(--font-size-xs); font-weight: var(--font-weight-medium);">Goedgekeurd</span>',
          invalid: '<span style="padding: 0.25rem 0.75rem; background: #fee2e2; color: #991b1b; border-radius: var(--border-radius-full); font-size: var(--font-size-xs); font-weight: var(--font-weight-medium);">Ongeldig</span>',
          archived: '<span style="padding: 0.25rem 0.75rem; background: var(--color-neutral-100); color: var(--color-neutral-600); border-radius: var(--border-radius-full); font-size: var(--font-size-xs); font-weight: var(--font-weight-medium);">Gearchiveerd</span>'
        };
        return badges[status] || status;
      }

      function render() {
        const sorted = getSortedVersions();
        const start = (currentPage - 1) * pageSize;
        const end = start + pageSize;
        const page = sorted.slice(start, end);

        document.getElementById('app').innerHTML = `
          <dc-nav-header
            user-name="${state.currentUser.name}"
            user-role="${state.currentUser.role}"
            active-route="/customers">
          </dc-nav-header>

          <main style="padding: var(--space-6); background: #f8fafc; min-height: calc(100vh - 64px);">
            <div class="container" style="max-width: 1440px; margin: 0 auto;">
              <!-- Breadcrumbs -->
              <div style="margin-bottom: var(--space-4); display: flex; gap: var(--space-2); align-items: center; font-size: var(--font-size-sm); color: var(--color-text-secondary);">
                <a href="#/customers" style="color: var(--color-primary-500); text-decoration: none;" id="breadcrumbCustomers">Klanten</a>
                <span>/</span>
                <a href="#/customers/${customerId}" style="color: var(--color-primary-500); text-decoration: none;" id="breadcrumbCustomer">${customer.name}</a>
                <span>/</span>
                <span style="color: var(--color-text-primary);">${advisory.name}</span>
              </div>

              <!-- Advisory details card -->
              <dc-card style="margin-bottom: var(--space-6);">
                <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: var(--space-4);">
                  <div>
                    <h2 style="margin-bottom: var(--space-2);">${advisory.name}</h2>
                    <div style="display: flex; gap: var(--space-3); align-items: center;">
                      ${getStatusBadge(advisory.status)}
                      <span style="color: var(--color-text-secondary); font-size: var(--font-size-sm);">
                        voor ${customer.name}
                      </span>
                    </div>
                  </div>
                </div>
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-4); margin-top: var(--space-4); padding-top: var(--space-4); border-top: var(--border-width-thin) solid var(--color-border);">
                  <div>
                    <div style="font-size: var(--font-size-sm); color: var(--color-text-secondary); margin-bottom: var(--space-1);">Aangemaakt</div>
                    <div>${new Date(advisory.createdAt).toLocaleDateString('nl-NL')}</div>
                  </div>
                  <div>
                    <div style="font-size: var(--font-size-sm); color: var(--color-text-secondary); margin-bottom: var(--space-1);">Laatst gewijzigd</div>
                    <div>${new Date(advisory.updatedAt).toLocaleDateString('nl-NL')}</div>
                  </div>
                  <div>
                    <div style="font-size: var(--font-size-sm); color: var(--color-text-secondary); margin-bottom: var(--space-1);">Aantal berekeningen</div>
                    <div>${advisory.versionCount}</div>
                  </div>
                </div>
              </dc-card>

              <!-- Versions section -->
              <div style="margin-bottom: var(--space-4); display: flex; justify-content: space-between; align-items: center;">
                <div>
                  <h3 style="margin-bottom: var(--space-1);">Berekeningen</h3>
                  <p style="color: var(--color-text-secondary); font-size: var(--font-size-sm);">
                    ${versions.length} ${versions.length === 1 ? 'berekening' : 'berekeningen'}
                  </p>
                </div>
                <dc-button variant="primary" id="newVersionButton">
                  + Nieuwe berekening
                </dc-button>
              </div>

              <dc-table
                id="versionsTable"
                current-page="${currentPage}"
                page-size="${pageSize}"
                total-items="${versions.length}"
                sort-column="${sortColumn}"
                sort-direction="${sortDirection}">
                <table slot="table">
                  <thead>
                    <tr>
                      <th data-sortable="name">Naam</th>
                      <th data-sortable="product">Product</th>
                      <th data-sortable="roi">ROI</th>
                      <th data-sortable="paybackYears">Terugverdientijd</th>
                      <th data-sortable="status">Status</th>
                      <th data-sortable="updatedAt">Laatst gewijzigd</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${page.map(version => `
                      <tr data-row-id="${version.id}">
                        <td><strong>${version.name}</strong></td>
                        <td>${version.product}<br><small style="color: var(--color-text-secondary);">${version.capacity}</small></td>
                        <td>${version.roi}</td>
                        <td>${version.paybackYears} jaar</td>
                        <td>${getStatusBadge(version.status)}</td>
                        <td>${new Date(version.updatedAt).toLocaleDateString('nl-NL')}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </dc-table>
            </div>
          </main>
        `;

        // Handle navigation
        document.querySelector('dc-nav-header').addEventListener('navigate', (e) => {
          router.navigate(e.detail.route);
        });

        document.querySelector('dc-nav-header').addEventListener('logout', () => {
          auth.logout();
          showLogin();
        });

        // Handle breadcrumb clicks
        document.getElementById('breadcrumbCustomers').addEventListener('click', (e) => {
          e.preventDefault();
          router.navigate('/customers');
        });

        document.getElementById('breadcrumbCustomer').addEventListener('click', (e) => {
          e.preventDefault();
          router.navigate(`/customers/${customerId}`);
        });

        // Handle new version button
        document.getElementById('newVersionButton').addEventListener('click', () => {
          alert('Nieuwe berekening maken - wordt nog geïmplementeerd');
        });

        // Handle table events
        const table = document.getElementById('versionsTable');

        table.addEventListener('row-click', (e) => {
          alert(`Berekening ${e.detail.rowId} openen - wordt nog geïmplementeerd`);
        });

        table.addEventListener('sort-change', (e) => {
          sortColumn = e.detail.column;
          sortDirection = e.detail.direction;
          render();
        });

        table.addEventListener('page-change', (e) => {
          currentPage = e.detail.page;
          render();
        });
      }

      render();
    }

    // Start the app
    init();
  </script>
</body>
</html>
